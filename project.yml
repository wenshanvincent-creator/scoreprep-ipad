name: ScorePrep
options:
  minimumXcodeGenVersion: "2.43.0"
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  ScoreCore:
    path: Packages/ScoreCore
  Verovio:
    url: https://github.com/rism-digital/verovio.git
    revision: 425dd7b6ba26edcecbe345c10b15586d095743d9
targets:
  ScorePrep:
    type: application
    platform: iOS
    sources:
      - ScoreApp
      - ScoreRendering
      - ScoreAudio
      - ScoreRecognition
    dependencies:
      - package: ScoreCore
      - package: Verovio
        product: VerovioToolkit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.scoreprep.ScorePrep
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: build/ScorePrep-Info.plist
      properties:
        CFBundleDisplayName: ScorePrep
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  ScorePrepUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ScorePrepUITests
    dependencies:
      - target: ScorePrep
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.scoreprep.ScorePrep.UITests
        GENERATE_INFOPLIST_FILE: YES
  RecognitionHarness:
    type: application
    platform: iOS
    sources:
      - backend/native-harness
      - ScoreRecognition
      - ScoreRendering/Recognition
    dependencies:
      - package: Verovio
        product: VerovioToolkit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.scoreprep.RecognitionHarness
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: build/RecognitionHarness-Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  RecognitionRenderingUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [backend/native-tests]
    dependencies:
      - target: RecognitionHarness
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.scoreprep.RecognitionRenderingUITests
  RecognitionContractTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - backend/native-unit
      - path: backend/fixtures/recognition-study.musicxml
        buildPhase: resources
    dependencies:
      - target: RecognitionHarness
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.scoreprep.RecognitionContractTests
schemes:
  RecognitionHarness:
    build:
      targets:
        RecognitionHarness: all
        RecognitionRenderingUITests: [test]
        RecognitionContractTests: [test]
    test:
      targets:
        - RecognitionContractTests
        - RecognitionRenderingUITests
  ScorePrep:
    build:
      targets:
        ScorePrep: all
        ScorePrepUITests: [test]
    test:
      targets:
        - ScorePrepUITests
