name: ScorePrep
options:
  minimumXcodeGenVersion: "2.43.0"
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  ScoreCore:
    path: Packages/ScoreCore
targets:
  ScorePrep:
    type: application
    platform: iOS
    sources:
      - ScoreApp
      - ScoreRendering
      - ScoreAudio
    dependencies:
      - package: ScoreCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.scoreprep.ScorePrep
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: build/ScorePrep-Info.plist
      properties:
        CFBundleDisplayName: ScorePrep
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  ScorePrepUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ScorePrepUITests
    dependencies:
      - target: ScorePrep
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.scoreprep.ScorePrep.UITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ScorePrep:
    build:
      targets:
        ScorePrep: all
        ScorePrepUITests: [test]
    test:
      targets:
        - ScorePrepUITests
