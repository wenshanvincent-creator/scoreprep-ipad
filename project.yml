name: ScorePrep
options:
  minimumXcodeGenVersion: "2.43.0"
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  ScoreCore:
    path: Packages/ScoreCore
  Verovio:
    path: build/dependencies/verovio
targets:
  ScorePrep:
    type: application
    platform: iOS
    sources:
      - ScoreApp
      - ScoreRendering
      - ScoreAudio
      - ScoreRecognition
      - path: Fixtures/RecognitionReplay
        type: folder
        buildPhase: resources
      - path: Fixtures/Practice
        type: folder
        buildPhase: resources
    dependencies:
      - package: ScoreCore
      - package: Verovio
        product: VerovioToolkit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.scoreprep.ScorePrep
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": tools/ScorePrep-Simulator.entitlements
    info:
      path: build/ScorePrep-Info.plist
      properties:
        CFBundleDisplayName: ScorePrep
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  ScorePrepUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ScorePrepUITests
    dependencies:
      - target: ScorePrep
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.scoreprep.ScorePrep.UITests
        GENERATE_INFOPLIST_FILE: YES
  ScorePrepTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ScorePrepTests
    dependencies:
      - target: ScorePrep
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.scoreprep.ScorePrep.Tests
        GENERATE_INFOPLIST_FILE: YES
  RecognitionHarness:
    type: application
    platform: iOS
    sources:
      - backend/native-harness
      - path: backend/fixtures/recognition-study.musicxml
        buildPhase: resources
      - ScoreRecognition
      - ScoreRendering/Recognition
    dependencies:
      - package: Verovio
        product: VerovioToolkit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.scoreprep.RecognitionHarness
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: build/RecognitionHarness-Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  RecognitionRenderingUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [backend/native-tests]
    dependencies:
      - target: RecognitionHarness
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.scoreprep.RecognitionRenderingUITests
  RecognitionContractTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - backend/native-unit
      - path: backend/fixtures/recognition-study.musicxml
        buildPhase: resources
      - path: backend/fixtures/observed-homr/homr-observed.musicxml
        buildPhase: resources
    dependencies:
      - package: Verovio
        product: VerovioToolkit
      - target: RecognitionHarness
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.scoreprep.RecognitionContractTests
schemes:
  RecognitionHarness:
    build:
      targets:
        RecognitionHarness: all
        RecognitionRenderingUITests: [test]
        RecognitionContractTests: [test]
    test:
      targets:
        - RecognitionContractTests
        - RecognitionRenderingUITests
  ScorePrep:
    build:
      targets:
        ScorePrep: all
        ScorePrepTests: [test]
        ScorePrepUITests: [test]
    test:
      targets:
        - ScorePrepTests
        - ScorePrepUITests
