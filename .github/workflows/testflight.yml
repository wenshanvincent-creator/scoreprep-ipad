name: TestFlight preparation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload:
        description: 'Sign and upload to TestFlight (requires configured testflight environment)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: false
jobs:
  archive:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - run: sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
      - run: brew install xcodegen
      - name: Build unsigned universal release archive
        run: bash tools/archive_beta.sh
      - name: Save archive preparation evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: scoreprep-beta-preparation
          path: |
            build/ScorePrep-unsigned.zip
            build/beta-*.log
            build/beta-*.txt
            build/beta-*.json
          retention-days: 7
  upload:
    if: github.event_name == 'workflow_dispatch' && inputs.upload && github.ref == 'refs/heads/main'
    needs: archive
    environment: testflight
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - run: sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
      - run: brew install xcodegen
      - name: Sign and upload using private environment credentials
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_BUNDLE_ID: ${{ vars.APPLE_BUNDLE_ID }}
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          APPLE_PROFILE_BASE64: ${{ secrets.APPLE_PROFILE_BASE64 }}
        run: bash tools/upload_testflight.sh
