name: iPad build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Test musical timing and route compilation
        run: swift test --package-path Packages/ScoreCore
      - name: Install project generator
        run: brew install xcodegen
      - name: Build and smoke-test the iPad app
        run: bash tools/ci.sh
      - name: Save simulator and build evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: scoreprep-ipad-build
          path: |
            build/*.log
            build/*.txt
            build/*.png
            build/Smoke.xcresult/
          retention-days: 7
          if-no-files-found: warn
